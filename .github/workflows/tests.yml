name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test

      # The suite fakes the model at the HTTP layer and blocks any real request,
      # so it needs no API key and costs nothing.
      - name: Run tests
        run: php artisan test

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t triagedesk:local .

      - name: Start it and check it answers
        run: |
          docker network create qiyuan-edge
          cp .env.example .env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" .env
          docker compose up -d --no-build
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q web)")" = healthy ] && break
            sleep 3
          done
          docker compose exec -T web php -r "echo file_get_contents('http://127.0.0.1:8080/login') ? 'login ok' : exit(1);"
          docker compose exec -T web php artisan tinker --execute 'echo App\Models\Ticket::count()." tickets";'
          docker compose ps
